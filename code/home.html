        <script>
            const createPost = postData => {
                const postOuter = document.createElement("div");
                postOuter.classList.add("post-outer");

                const storeDiv = document.createElement("div");
                storeDiv.classList.add("store");

                const infoDiv = document.createElement("div");
                infoDiv.classList.add("info");

                const link = document.createElement("a");
                link.href = postData.link;
                link.title = postData.title.$t;

                const shadowSpan = document.createElement("span");
                shadowSpan.classList.add("shadown");

                const img = document.createElement("img");
                img.alt = postData.title.$t;
                img.src = postData.media$thumbnail.url;
                img.height = 70;
                img.width = 70;

                shadowSpan.appendChild(img);

                const commentSpan = document.createElement("span");
                commentSpan.classList.add("comment");

                const strong = document.createElement("strong");
                strong.textContent = postData.title.$t;

                commentSpan.appendChild(strong);

                const descriptionParagraph = document.createElement("p");
                const descriptionSpan = document.createElement("span");
                descriptionSpan.classList.add("post_date");
                descriptionSpan.innerHTML = postData.summary.$t;

                descriptionParagraph.appendChild(descriptionSpan);

                /* const platformsSpan = document.createElement("span");
                platformsSpan.classList.add("post_view");
                platformsSpan.textContent = postData.platforms.join(" "); */

                const ratingSpan = document.createElement("span");
                ratingSpan.classList.add("rating-static", "rating-50");

                link.appendChild(shadowSpan);
                link.appendChild(commentSpan);
                link.appendChild(descriptionParagraph);
                /* link.appendChild(platformsSpan); */
                link.appendChild(ratingSpan);

                infoDiv.appendChild(link);
                storeDiv.appendChild(infoDiv);
                postOuter.appendChild(storeDiv);

                return postOuter;
            }

            const displayLabelPosts = (posts, label) => {
                console.log(posts);
                /* const blogPostsContainer = document.querySelector('.category-' + label); */
                const blogPostsContainer = document.querySelector(`[data-category="${label}"]`);
                posts.feed.entry.forEach((post) => {
                    const postElement = createPost(post);
                    blogPostsContainer.appendChild(postElement);
                });
            };

            const queryPostsByLabel = (label) => {
                const url = 'feeds/posts/summary/-/' + label + '?max-results=10&amp;alt=json';
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        displayLabelPosts(data, label); // Log the data
                    })

            }
        </script>

                                var paginator = function (callback) {
                                    if (hasMore()) {
                                        var url = config.feed + '?alt=json&v=2&orderby=published&reverse=false&max-results=50';
                                        if (cursor) {
                                            url += '&published-min=' + new Date(cursor).toISOString();
                                        }
                                        window.bloggercomments = function (data) {
                                            var parsed = parse(data);
                                            cursor = parsed.length < 50 ? null
                                                : parseInt(parsed[parsed.length - 1].timestamp) + 1
                                            callback(parsed);
                                            window.bloggercomments = null;
                                        }
                                        url += '&callback=bloggercomments';
                                        var script = document.createElement('script');
                                        script.type = 'text/javascript';
                                        script.src = url;
                                        document.getElementsByTagName('head')[0].appendChild(script);
                                    }
                                };
                                var hasMore = function () {
                                    return !!cursor;
                                };
                                var getMeta = function (key, comment) {
                                    if ('iswriter' == key) {
                                        var matches = !!comment.author
                                            && comment.author.name == config.authorName
                                            && comment.author.profileUrl == config.authorUrl;
                                        return matches ? 'true' : '';
                                    } else if ('deletelink' == key) {
                                        return config.baseUri + '/delete-comment.g?blogID='
                                            + config.blogId + '&postID=' + comment.id;
                                    } else if ('deleteclass' == key) {
                                        return comment.deleteclass;
                                    }
                                    return '';
                                };

                                var replybox = null;
                                var replyUrlParts = null;
                                var replyParent = undefined;

                                var onReply = function (commentId, domId) {
                                    if (replybox == null) {

                                        replybox = document.getElementById('comment-editor');
                                        if (replybox != null) {
                                            replybox.height = '250px';
                                            replybox.style.display = 'block';
                                            replyUrlParts = replybox.src.split('#');
                                        }
                                    }
                                    if (replybox && (commentId !== replyParent)) {
                                        document.getElementById(domId).insertBefore(replybox, null);
                                        replybox.src = replyUrlParts[0]
                                            + (commentId ? '&parentID=' + commentId : '')
                                            + '#' + replyUrlParts[1];
                                        replyParent = commentId;
                                    }
                                };

                                var hash = (window.location.hash || '#').substring(1);
                                var startThread, targetComment;
                                if (/^comment-form_/.test(hash)) {
                                    startThread = hash.substring('comment-form_'.length);
                                } else if (/^c[0-9]+$/.test(hash)) {
                                    targetComment = hash.substring(1);

                                // Configure commenting API:
                                var configJso = {
                                    'maxDepth': config.maxThreadDepth

                                var provider = {
                                    'id': config.postId,
                                    'data': items,
                                    'loadNext': paginator,
                                    'hasMore': hasMore,
                                    'getMeta': getMeta,
                                    'onReply': onReply,
                                    'rendered': true,
                                    'initComment': targetComment,
                                    'initReplyThread': startThread,
                                    'config': configJso,
                                    'messages': msgs
                                };

                                        window.goog.comments.render(holder, provider);

                                // render now, or queue to render when library loads:
                                if (window.goog && window.goog.comments) {

                        </b:includable>
                        <b:includable id='threaded_comments' var='post'>
                            <div class='comments' id='comments'>
                                <a name='comments' />
                                <div class='nav'>
                                    <h4>
                                        <data:post.commentLabelFull />:
                                    </h4>
                                </div>

                                <div class='comments-content'>
                                    <b:if cond='data:post.embedCommentForm'>
                                        <b:include data='post' name='threaded_comment_js' />
                                    </b:if>
                                    <div id='comment-holder'>
                                        <data:post.commentHtml />
                                    </div>
                                </div>

                                <p class='comment-footer'>
                                    <b:if cond='data:post.allowNewComments'>
                                        <b:include data='post' name='threaded-comment-form' />
                                        <b:else />
                                        <data:post.noNewCommentsText />
                                    </b:if>
                                </p>

                                <b:if cond='data:showCmtPopup'>
                                    <div id='comment-popup'>
                                        <iframe allowtransparency='true' frameborder='0' id='comment-actions'
                                            name='comment-actions' scrolling='no'>
                                        </iframe>
                                    </div>
                                </b:if>


                            </div>
                        </b:includable>
                    </b:widget>
                </b:section>
            </div>

            <b:if cond='data:blog.url != data:blog.homepageUrl'>

                <div id='sidebar-wrapper'>
                    <b:section class='sidebar' id='sidebar' preferred='yes'>
                        <b:widget id='Label2' locked='false' title='Chuyên Mục' type='Label' version='1'>
                            <b:widget-settings>
                                <b:widget-setting name='sorting'>ALPHA</b:widget-setting>
                                <b:widget-setting name='display'>LIST</b:widget-setting>
                                <b:widget-setting name='selectedLabelsList' />
                                <b:widget-setting name='showType'>ALL</b:widget-setting>
                                <b:widget-setting name='showFreqNumbers'>false</b:widget-setting>
                            </b:widget-settings>
                            <b:includable id='main'>

                                <b:if cond='data:title'>
                                    <div class='nav'>
                                        <data:title />
                                    </div>
                                </b:if>
                                <div
                                    expr:class='&quot;widget-content &quot; + data:display + &quot;-label-widget-content&quot;'>
                                    <b:if cond='data:display == &quot;list&quot;'>

                                        <b:loop values='data:labels' var='label'>
                                            <div class='list'>
                                                <b:if cond='data:blog.url == data:label.url'>
                                                    <span>
                                                        <data:label.name />
                                                    </span>
                                                    <b:else />
                                                    <a expr:href='data:label.url' expr:title='data:label.name'
                                                        rel='tag'>
                                                        <data:label.name />
                                                    </a>
                                                </b:if>
                                                <b:if cond='data:showFreqNumbers'>
                                                    <span class='badge bg-info'>
                                                        <data:label.count />
                                                    </span>
                                                </b:if>
                                            </div>
                                        </b:loop>
                                        <b:else />
                                        <b:loop values='data:labels' var='label'>
                                            <span expr:class='&quot;label-size label-size-&quot; + data:label.cssSize'>
                                                <b:if cond='data:blog.url == data:label.url'>
                                                    <span expr:dir='data:blog.languageDirection'>
                                                        <data:label.name />
                                                    </span>
                                                    <b:else />
                                                    <a expr:dir='data:blog.languageDirection'
                                                        expr:href='data:label.url'>
                                                        <data:label.name />
                                                    </a>
                                                </b:if>
                                                <b:if cond='data:showFreqNumbers'>
                                                    <span class='label-count'>(
                                                        <data:label.count />)
                                                    </span>
                                                </b:if>
                                            </span>
                                        </b:loop>

                                    </b:if>

                                </div>

                            </b:includable>
                        </b:widget>
                    </b:section>
                </div>
            </b:if>
        </div>
    </div>
